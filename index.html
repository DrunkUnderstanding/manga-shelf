<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>漫画书架</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23141414'/%3E%3Cpath d='M14 16h16c3 0 2 2 2 4v30c-2-2-4-3-7-3H14zM50 16H34c-3 0-2 2-2 4v30c2-2 4-3 7-3h11z' fill='%23f0a33a'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#141414; --bar:#1c1c1c; --line:#2a2a2a; --text:#e8e6e3; --muted:#9a9895;
  --accent:#f0a33a; --hover:#242424; --read-bg:#000;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}

/* ---------- 书架 ---------- */
#library{min-height:100%}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;
  padding:14px 32px;background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.5px}
.topbar .count{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.search{background:#111;border:1px solid var(--line);border-radius:6px;color:var(--text);
  padding:7px 12px;width:220px;font:inherit;font-size:14px;outline:none}
.search:focus{border-color:#555}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:#2c2c2c;color:var(--text)}
.continue{margin:28px 32px 0;display:flex;gap:20px;align-items:center;padding:18px;
  background:#1b1b1b;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.continue:hover{background:var(--hover)}
.continue img{height:120px;border-radius:3px;box-shadow:0 4px 14px #0008}
.continue .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.continue .t{font-size:17px;font-weight:600;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 26px;padding:28px 32px 60px}
.book{cursor:pointer;outline:none}
.cover{position:relative;aspect-ratio:2/3;background:#222;border-radius:3px;overflow:hidden;
  box-shadow:0 3px 10px #0007;transition:transform .15s,box-shadow .15s}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-4px);box-shadow:0 10px 24px #000a}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;right:8px;background:#000c;color:#fff;font-size:11px;padding:2px 7px;border-radius:10px}
.pbar{height:3px;background:#2e2e2e;margin-top:9px;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.book .name{font-size:13px;line-height:1.35;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .meta{font-size:12px;color:var(--muted);margin-top:3px}
.empty{padding:80px 32px;color:var(--muted);text-align:center;line-height:1.8}

/* ---------- 阅读 ---------- */
#reader{position:fixed;inset:0;background:var(--read-bg);overflow:hidden;user-select:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage img{display:block;image-rendering:auto}
#reader.idle{cursor:none}
.zone{position:absolute;top:0;bottom:0;z-index:2}
.zone.l{left:0;width:32%} .zone.r{right:0;width:32%} .zone.c{left:32%;right:32%}
.rbar{position:absolute;left:0;right:0;z-index:4;background:#1b1b1b;transition:opacity .18s,transform .18s}
.rtop{top:0;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #2a2a2a}
.rtop .title{flex:1;text-align:center;font-size:14px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{padding:6px 12px;border-radius:6px;font-size:14px;color:#ddd}
.rbtn:hover{background:#2c2c2c}
.rbot{bottom:0;padding:14px 28px 16px;border-top:1px solid #2a2a2a}
.rbot input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.rbot .info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
#reader.chrome-off .rtop{opacity:0;transform:translateY(-100%);pointer-events:none}
#reader.chrome-off .rbot{opacity:0;transform:translateY(100%);pointer-events:none}
.menu{position:absolute;top:52px;right:14px;z-index:6;width:300px;background:#1e1e1e;border:1px solid #333;
  border-radius:10px;padding:14px;box-shadow:0 12px 30px #000a;font-size:13px}
.menu h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:500}
.menu .seg{margin-bottom:14px}
.menu .seg button{flex:1}
.menu .tip{color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid #2c2c2c;padding-top:10px}
.endcard{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;background:#000d;font-size:15px}
.endcard .row{display:flex;gap:12px}
.pill{padding:9px 20px;border-radius:20px;border:1px solid #444;font-size:14px}
.pill.main{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:6;background:#000c;
  padding:7px 16px;border-radius:16px;font-size:13px;color:#ddd;pointer-events:none;transition:opacity .3s}
.menu .rot{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.menu .rot span{flex:1;color:#ccc;white-space:nowrap}
.menu .rot button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:#ddd}
.menu .rot button:hover{background:#2c2c2c}
.menu .rot em{font-style:normal;color:var(--accent);font-size:11px;margin-left:4px}
.menu .rots{margin-bottom:14px}

/* ---------- 从 Kindle 导入 ---------- */
.tbtn{padding:7px 14px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--text);white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn.busy{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{width:min(620px,100%);max-height:min(720px,100%);display:flex;flex-direction:column;background:#1c1c1c;
  border:1px solid #333;border-radius:12px;box-shadow:0 20px 60px #000c}
.dlg header{display:flex;align-items:center;padding:16px 20px 6px}
.dlg header h2{flex:1;margin:0;font-size:17px;font-weight:600}
.dlg .x{font-size:20px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.dlg .x:hover{background:#2c2c2c;color:var(--text)}
.dlg .sub{padding:0 20px 12px;color:var(--muted);font-size:12px;line-height:1.6;word-break:break-all}
.klist{flex:1;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:120px}
.krow{display:flex;align-items:center;gap:12px;padding:9px 20px;font-size:13px;border-bottom:1px solid #232323;cursor:pointer}
.krow:hover{background:#222}
.krow.off{cursor:default;color:var(--muted)}
.krow input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:inherit}
.krow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .s{color:var(--muted);font-size:12px;white-space:nowrap}
.krow .s.ok{color:#7fbf7f} .krow .s.err{color:#e07a6a} .krow .s.doing{color:var(--accent)}
.kmsg{padding:40px 20px;color:var(--muted);text-align:center;line-height:1.8;font-size:13px}
.dlg footer{padding:14px 20px 16px}
.kprog{margin-bottom:12px}
.kprog .bar{height:6px;background:#2e2e2e;border-radius:3px;overflow:hidden}
.kprog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.kprog .lbl{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfoot{display:flex;align-items:center;gap:12px;font-size:13px}
.kfoot label{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer}
.kfoot label input{accent-color:var(--accent)}
.kfoot .spacer{flex:1}
.kfoot .pill:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>

<section id="library">
  <div class="topbar">
    <h1>图书馆</h1><span class="count" id="count"></span>
    <div class="spacer"></div>
    <button class="tbtn" id="kbtn" title="把 Kindle 电脑版里的漫画转成 cbz 放进书架">从 Kindle 导入</button>
    <input class="search" id="q" placeholder="搜索书名" autocomplete="off">
    <div class="seg" id="sort">
      <button data-v="recent">最近阅读</button><button data-v="title">书名</button>
    </div>
  </div>
  <div id="cont"></div>
  <div class="grid" id="grid"></div>
</section>

<div class="modal hidden" id="kmodal">
  <div class="dlg" role="dialog" aria-labelledby="ktitle">
    <header><h2 id="ktitle">从 Kindle 导入</h2><button class="x" id="kclose" title="关闭（导入会在后台继续）">×</button></header>
    <div class="sub" id="ksub">正在查找 Kindle 电脑版里的书…</div>
    <div class="klist" id="klist"></div>
    <footer>
      <div class="kprog hidden" id="kprog"><div class="bar"><i id="kbar"></i></div><div class="lbl" id="klbl"></div></div>
      <div class="kfoot">
        <label><input type="checkbox" id="kall"> 全选未导入</label>
        <div class="spacer"></div>
        <span id="kcount" style="color:var(--muted)"></span>
        <button class="pill main" id="kgo" disabled>导入</button>
      </div>
    </footer>
  </div>
</div>

<section id="reader" class="hidden chrome-off">
  <div id="stage"></div>
  <div class="zone l" data-z="l"></div><div class="zone c" data-z="c"></div><div class="zone r" data-z="r"></div>
  <div class="rbar rtop">
    <button class="rbtn" id="back" title="返回图书馆（Esc）"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <div class="title" id="rtitle"></div>
    <button class="rbtn" id="full" title="全屏（F）">⛶</button>
    <button class="rbtn" id="aa" title="显示设置">Aa</button>
  </div>
  <div class="rbar rbot">
    <input type="range" id="slider" min="0" value="0">
    <div class="info"><span id="pinfo"></span><span id="pct"></span></div>
  </div>
  <div class="menu hidden" id="menu">
    <h4>页面布局</h4>
    <div class="seg" data-k="layout"><button data-v="single">单页</button><button data-v="double">双页</button></div>
    <h4>翻页方向</h4>
    <div class="seg" data-k="dir"><button data-v="rtl">从右往左（日漫）</button><button data-v="ltr">从左往右</button></div>
    <h4>背景</h4>
    <div class="seg" data-k="bg"><button data-v="#111">黑色</button><button data-v="#2a2a2a">深灰</button><button data-v="#f4efe6">纸白</button></div>
    <h4>旋转本页</h4>
    <div class="rots" id="rots"></div>
    <div class="tip">点屏幕左右两侧翻页，点中间显示菜单。<br>键盘：← → 翻页，F 全屏，Esc 返回。<br>横向跨页始终整张显示。</div>
  </div>
  <div class="endcard hidden" id="end"></div>
  <div class="toast" id="toast" style="opacity:0"></div>
</section>

<script>
const report = m => { try { fetch('/api/log', {method:'POST', body:String(m)}) } catch {} };
addEventListener('error', e => report('error: ' + e.message + ' @' + e.lineno));
addEventListener('unhandledrejection', e => report('reject: ' + (e.reason && (e.reason.stack || e.reason))));
report('boot ' + navigator.userAgent + ' ' + innerWidth + 'x' + innerHeight);
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
const prefs = Object.assign({layout:'single', dir:'rtl', bg:'#111'}, store.get('prefs', {}));
let sortMode = store.get('sort', 'recent');
let BOOKS = [];

/* ---------------- 书架 ---------------- */
async function loadLibrary(){
  BOOKS = await (await fetch('/api/books')).json();
  renderLibrary();
}
function pctOf(b){ return b.progress ? Math.round((b.progress.page + 1) / b.total * 100) : 0 }
function sorted(){
  const list = BOOKS.slice();
  if (sortMode === 'title') return list;
  return list.sort((a, b) => (b.progress?.ts || 0) - (a.progress?.ts || 0) || 0);
}
function renderLibrary(){
  document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('on', b.dataset.v === sortMode));
  const q = $('#q').value.trim().toLowerCase();
  const list = sorted().filter(b => !q || b.title.toLowerCase().includes(q));
  $('#count').textContent = `${BOOKS.length} 本`;
  const last = BOOKS.filter(b => b.progress).sort((a, b) => b.progress.ts - a.progress.ts)[0];
  $('#cont').innerHTML = last && !q ? `
    <div class="continue" data-id="${encodeURIComponent(last.id)}">
      <img src="/cover?id=${encodeURIComponent(last.id)}" alt="">
      <div style="flex:1"><div class="k">继续阅读</div><div class="t">${esc(last.title)}</div>
      <div class="pbar" style="max-width:360px"><i style="width:${pctOf(last)}%"></i></div>
      <div class="meta" style="font-size:12px;color:var(--muted);margin-top:6px">第 ${last.progress.page + 1} / ${last.total} 页 · 已读 ${pctOf(last)}%</div></div>
    </div>` : '';
  $('#grid').innerHTML = list.length ? list.map(b => {
    const p = pctOf(b);
    return `<div class="book" tabindex="0" data-id="${encodeURIComponent(b.id)}">
      <div class="cover"><img loading="lazy" src="/cover?id=${encodeURIComponent(b.id)}" alt="">
        ${!b.progress ? '<span class="badge">新</span>' : p >= 100 ? '<span class="badge">已读完</span>' : ''}</div>
      ${b.progress ? `<div class="pbar"><i style="width:${p}%"></i></div>` : ''}
      <div class="name">${esc(b.title)}</div>
      <div class="meta">${b.progress ? `已读 ${p}%` : `${b.total} 页`}</div></div>`;
  }).join('') : `<div class="empty">${BOOKS.length ? '没有匹配的书' : '书架是空的<br>点右上角「从 Kindle 导入」，或把 .cbz / .zip 漫画放进书库文件夹'}</div>`;
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
$('#library').addEventListener('click', e => {
  const el = e.target.closest('[data-id]'); if (el) location.hash = '#/read/' + el.dataset.id;
});
$('#library').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.id) location.hash = '#/read/' + e.target.dataset.id;
});
$('#q').addEventListener('input', renderLibrary);
$('#sort').addEventListener('click', e => {
  const v = e.target.dataset.v; if (!v) return; sortMode = v; store.set('sort', v); renderLibrary();
});

/* ---------------- 阅读器 ---------------- */
const R = {book:null, dims:[], rot:[], views:[], vi:0, page:0};
function isWide(i){ const d = R.dims[i]; return d && d[0] > d[1] }
function buildViews(){
  const n = R.dims.length, v = [];
  if (prefs.layout === 'single' || innerWidth < innerHeight) { for (let i = 0; i < n; i++) v.push([i]); }
  else {
    let i = 0;
    v.push([i++]);                               // 封面单独
    while (i < n) {
      if (isWide(i) || i === n - 1 || isWide(i + 1)) v.push([i++]);
      else { v.push([i, i + 1]); i += 2; }
    }
  }
  R.views = v;
  R.vi = Math.max(0, v.findIndex(x => x.includes(R.page)));
}
async function openBook(id){
  const meta = await (await fetch('/api/book?id=' + encodeURIComponent(id))).json();
  if (meta.error) { location.hash = ''; return; }
  R.book = BOOKS.find(b => b.id === id) || {id, title:id.replace(/\.(cbz|zip)$/i, '')};
  R.dims = meta.dims; R.rot = meta.rot || meta.dims.map(() => 0);
  const p = meta.progress?.page || 0;
  R.page = p >= R.dims.length - 1 ? 0 : p;     // 读完的书从头开始
  $('#rtitle').textContent = R.book.title;
  $('#library').classList.add('hidden'); $('#reader').classList.remove('hidden');
  $('#end').classList.add('hidden'); $('#menu').classList.add('hidden');
  document.title = R.book.title;
  applyPrefs(); buildViews(); show();
  if (meta.progress && p > 0 && p < R.dims.length - 1) toast(`从第 ${p + 1} 页继续`);
}
function show(){
  const view = R.views[R.vi]; if (!view) return;
  R.page = view[0];
  const order = prefs.dir === 'rtl' ? view.slice().reverse() : view;
  const W = innerWidth, H = innerHeight;
  const aspect = order.reduce((s, i) => s + R.dims[i][0] / R.dims[i][1], 0);
  const h = Math.floor(Math.min(H, W / aspect));
  const st = $('#stage'); st.innerHTML = '';
  for (const i of order) {
    const img = new Image();
    img.src = pageUrl(i); img.draggable = false;
    img.style.height = h + 'px'; img.style.width = Math.floor(h * R.dims[i][0] / R.dims[i][1]) + 'px';
    st.appendChild(img);
  }
  for (const d of [1, 2, -1]) (R.views[R.vi + d] || []).forEach(i => { new Image().src = pageUrl(i) });
  const s = $('#slider'); s.max = R.views.length - 1; s.value = R.vi;
  s.style.direction = prefs.dir === 'rtl' ? 'rtl' : 'ltr';
  const last = view[view.length - 1] + 1;
  $('#pinfo').textContent = view.length > 1 ? `第 ${view[0] + 1}–${last} 页 / 共 ${R.dims.length} 页` : `第 ${view[0] + 1} 页 / 共 ${R.dims.length} 页`;
  $('#pct').textContent = `${Math.round(last / R.dims.length * 100)}%`;
  history.replaceState(null, '', '#/read/' + encodeURIComponent(R.book.id) + '/' + R.page);
  saveProgress();
  if (!$('#menu').classList.contains('hidden')) syncRots();
}
const pageUrl = i => `/page?id=${encodeURIComponent(R.book.id)}&n=${i}&r=${R.rot[i] || 0}`;
let saveT;
function saveProgress(){
  clearTimeout(saveT);
  const view = R.views[R.vi];
  const body = JSON.stringify({id:R.book.id, page:view[view.length - 1] === R.dims.length - 1 ? R.dims.length - 1 : R.page, total:R.dims.length});
  saveT = setTimeout(() => fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body}).catch(() => {}), 400);
}
function go(d){
  if (!$('#end').classList.contains('hidden')) { if (d < 0) $('#end').classList.add('hidden'); return; }
  const n = R.vi + d;
  if (n < 0) { toast('已经是第一页'); return; }
  if (n >= R.views.length) { endCard(); return; }
  R.vi = n; show();
}
function endCard(){
  const list = BOOKS.slice(); const k = list.findIndex(b => b.id === R.book.id);
  const next = k >= 0 ? list[k + 1] : null;
  $('#end').innerHTML = `<div>《${esc(R.book.title)}》已读完</div><div class="row">
    <button class="pill" id="e-back">回到图书馆</button>
    ${next ? `<button class="pill main" id="e-next">下一卷：${esc(next.title.replace(/^.* - /, ''))}</button>` : ''}</div>`;
  $('#end').classList.remove('hidden');
  $('#e-back').onclick = () => location.hash = '';
  if (next) $('#e-next').onclick = () => location.hash = '#/read/' + encodeURIComponent(next.id) + '/0';
}
function nextDir(side){ return (side === 'l') === (prefs.dir === 'rtl') ? 1 : -1 }   // 日漫：点左边 = 下一页
function toggleChrome(on){
  const r = $('#reader'); const off = on === undefined ? !r.classList.contains('chrome-off') : !on;
  r.classList.toggle('chrome-off', off); if (off) $('#menu').classList.add('hidden');
}
document.querySelectorAll('.zone').forEach(z => z.addEventListener('click', () => {
  if (!$('#menu').classList.contains('hidden')) { $('#menu').classList.add('hidden'); return; }
  if (z.dataset.z === 'c') toggleChrome(); else { toggleChrome(false); go(nextDir(z.dataset.z)); }
}));
$('#slider').addEventListener('input', e => { R.vi = +e.target.value; show(); });
$('#back').onclick = () => location.hash = '';
$('#aa').onclick = e => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); syncMenu(); };
$('#full').onclick = () => toggleFull();
function toggleFull(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}) }
function syncMenu(){
  document.querySelectorAll('#menu .seg').forEach(s => s.querySelectorAll('button').forEach(b => b.classList.toggle('on', prefs[s.dataset.k] === b.dataset.v)));
  syncRots();
}
function syncRots(){
  // 双页时左右两页各一行，顺序和屏幕上一致
  const view = R.views[R.vi] || [];
  const order = prefs.dir === 'rtl' ? view.slice().reverse() : view;
  const side = (k) => order.length < 2 ? '' : k === 0 ? '左页 · ' : '右页 · ';
  $('#rots').innerHTML = order.map((i, k) => `<div class="rot"><span>${side(k)}第 ${i + 1} 页${R.rot[i] ? `<em>${R.rot[i]}°</em>` : ''}</span>
    <button data-p="${i}" data-by="-90" title="逆时针 90°">↺ 左转</button><button data-p="${i}" data-by="90" title="顺时针 90°">↻ 右转</button>
    ${R.rot[i] ? `<button data-p="${i}" data-by="0" title="恢复原样">还原</button>` : ''}</div>`).join('');
}
async function rotatePage(i, by){
  const body = by === 0 ? {id:R.book.id, n:i, deg:0} : {id:R.book.id, n:i, by};
  const r = await (await fetch('/api/rotate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
  if (r.error) { toast('旋转失败：' + r.error); return; }
  const old = R.rot[i] || 0;
  if ((r.deg - old) % 180) R.dims[i] = [R.dims[i][1], R.dims[i][0]];   // 转了 90° 宽高互换，跨页判断随之改变
  R.rot[i] = r.deg;
  R.page = i; buildViews(); show(); syncRots();
  toast(r.deg ? `第 ${i + 1} 页已旋转 ${r.deg}°` : `第 ${i + 1} 页已还原`);
}
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p != null) { rotatePage(+b.dataset.p, +b.dataset.by); return; }
  const s = e.target.closest('.seg'); if (!s) return;
  prefs[s.dataset.k] = b.dataset.v; store.set('prefs', prefs); syncMenu(); applyPrefs(); buildViews(); show();
});
function applyPrefs(){ document.documentElement.style.setProperty('--read-bg', prefs.bg) }
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1600) }

/* ---------------- 从 Kindle 导入 ---------------- */
const K = {books:[], sel:new Set(), job:null, timer:0, seen:0};
const mb = n => (n / 1048576).toFixed(0) + ' MB';
async function openKindle(){
  $('#kmodal').classList.remove('hidden');
  $('#ksub').textContent = '正在查找 Kindle 电脑版里的书…';
  $('#klist').innerHTML = '';
  try {
    const d = await (await fetch('/api/kindle')).json();
    if (d.error) throw new Error(d.error);
    K.books = d.books; K.job = d.job;
    K.sel = new Set([...K.sel].filter(a => K.books.some(b => b.asin === a && !b.imported)));
    $('#ksub').innerHTML = d.dirs.length
      ? `Kindle 内容目录：${d.dirs.map(esc).join('；')}<br>导入到：${esc(d.library)}`
      : '没有在 Kindle 电脑版里找到可导入的书。请先安装 Kindle 电脑版，并把要导入的书下载到本地。';
  } catch (err) {
    $('#ksub').textContent = '读取失败：' + err.message; K.books = [];
  }
  renderKindle();
  if (K.job?.running) pollKindle();
}
function renderKindle(){
  const job = K.job, running = !!job?.running;
  const st = {};
  (job?.items || []).forEach((it, k) => st[it.asin] = {...it, k});
  if (!K.books.length) {
    $('#klist').innerHTML = `<div class="kmsg">${$('#ksub').textContent.startsWith('正在') ? '' : '没有找到可导入的书<br>只支持通过「发送到 Kindle」传上去、没有 DRM 的个人文档'}</div>`;
  } else {
    $('#klist').innerHTML = K.books.map(b => {
      const s = st[b.asin];
      let label = b.imported ? '已导入' : mb(b.size), cls = '';
      if (s && (running || job.finished)) {
        if (s.state === 'wait') label = '等待中';
        else if (s.state === 'doing') { label = job.pages ? `导入中 ${Math.round(job.page / job.pages * 100)}%` : '读取中…'; cls = 'doing'; }
        else if (s.state === 'done') { label = '完成 · ' + s.msg; cls = 'ok'; }
        else if (s.state === 'skip') { label = '跳过 · ' + s.msg; cls = s.msg === '已存在' ? '' : 'err'; }
        else if (s.state === 'error') { label = '失败 · ' + s.msg; cls = 'err'; }
      }
      const off = b.imported || running;
      return `<label class="krow${off ? ' off' : ''}" title="${esc(b.title)}"><input type="checkbox" data-a="${b.asin}" ${K.sel.has(b.asin) && !b.imported ? 'checked' : ''} ${off ? 'disabled' : ''}>
        <span class="t">${esc(b.title)}</span><span class="s ${cls}">${esc(label)}</span></label>`;
    }).join('');
  }
  const avail = K.books.filter(b => !b.imported);
  $('#kall').checked = avail.length > 0 && avail.every(b => K.sel.has(b.asin));
  $('#kall').disabled = running || !avail.length;
  $('#kcount').textContent = running ? '' : avail.length ? `已选 ${K.sel.size} 本` : K.books.length ? '全部都已导入' : '';
  const go = $('#kgo');
  go.disabled = running || !K.sel.size;
  go.textContent = running ? '导入中…' : K.sel.size ? `导入 ${K.sel.size} 本` : '导入';
  // 进度条：已完成的书 + 当前这本的页进度
  const items = job?.items || [];
  $('#kprog').classList.toggle('hidden', !items.length || !(running || job.finished));
  if (items.length) {
    const doneN = items.filter(i => !['wait', 'doing'].includes(i.state)).length;
    const frac = running && job.pages ? job.page / job.pages : 0;
    $('#kbar').style.width = ((doneN + frac) / items.length * 100) + '%';
    const cur = items[job.index];
    $('#klbl').textContent = running
      ? `第 ${Math.min(doneN + 1, items.length)} / ${items.length} 本：${cur ? cur.title : ''}${job.pages ? `（${job.page} / ${job.pages} 页）` : ''}`
      : `导入完成：成功 ${items.filter(i => i.state === 'done').length} 本` +
        (items.some(i => i.state !== 'done') ? `，跳过或失败 ${items.filter(i => i.state !== 'done').length} 本` : '');
  }
  $('#kbtn').classList.toggle('busy', running);
  $('#kbtn').textContent = running ? `导入中 ${items.filter(i => !['wait', 'doing'].includes(i.state)).length}/${items.length}` : '从 Kindle 导入';
}
async function pollKindle(){
  clearTimeout(K.timer);
  try { K.job = await (await fetch('/api/kindle/status')).json(); } catch { K.timer = setTimeout(pollKindle, 1500); return; }
  const doneN = K.job.items.filter(i => i.state === 'done').length;
  if (doneN !== K.seen) {                       // 每导入完一本就刷新书架，并把它标成已导入
    K.seen = doneN;
    const ok = new Set(K.job.items.filter(i => i.state === 'done' || i.state === 'skip' && i.msg === '已存在').map(i => i.asin));
    K.books.forEach(b => { if (ok.has(b.asin)) { b.imported = true; K.sel.delete(b.asin); } });
    if ($('#reader').classList.contains('hidden')) loadLibrary();
  }
  renderKindle();
  if (K.job.running) K.timer = setTimeout(pollKindle, 500);
  else { if ($('#reader').classList.contains('hidden')) loadLibrary(); if (!doneN) K.seen = 0; }
}
async function startKindle(){
  const asins = K.books.filter(b => K.sel.has(b.asin) && !b.imported).map(b => b.asin);
  if (!asins.length) return;
  $('#kgo').disabled = true;
  const r = await (await fetch('/api/kindle/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({asins})})).json();
  if (r.error) { $('#kcount').textContent = r.error; $('#kgo').disabled = false; return; }
  K.job = r; K.seen = 0; renderKindle(); pollKindle();
}
$('#kbtn').onclick = openKindle;
$('#kclose').onclick = () => $('#kmodal').classList.add('hidden');
$('#kmodal').addEventListener('click', e => { if (e.target.id === 'kmodal') $('#kmodal').classList.add('hidden'); });
$('#kgo').onclick = startKindle;
$('#klist').addEventListener('change', e => {
  const a = e.target.dataset.a; if (!a) return;
  e.target.checked ? K.sel.add(a) : K.sel.delete(a); renderKindle();
});
$('#kall').addEventListener('change', e => {
  K.sel = new Set(e.target.checked ? K.books.filter(b => !b.imported).map(b => b.asin) : []); renderKindle();
});

addEventListener('keydown', e => {
  if (!$('#kmodal').classList.contains('hidden')) { if (e.key === 'Escape') $('#kmodal').classList.add('hidden'); return; }
  if ($('#reader').classList.contains('hidden')) { if (e.key === '/' ) { e.preventDefault(); $('#q').focus(); } return; }
  const k = e.key;
  if (k === 'ArrowLeft') go(nextDir('l'));
  else if (k === 'ArrowRight') go(nextDir('r'));
  else if (k === ' ' || k === 'PageDown' || k === 'ArrowDown') { e.preventDefault(); go(1); }
  else if (k === 'PageUp' || k === 'ArrowUp' || k === 'Backspace') { e.preventDefault(); go(-1); }
  else if (k === 'Home') { R.vi = 0; show(); }
  else if (k === 'End') { R.vi = R.views.length - 1; show(); }
  else if (k === 'f' || k === 'F' || k === 'F11') { e.preventDefault(); toggleFull(); }
  else if (k === 'Escape') { if (document.fullscreenElement) return; if (!$('#reader').classList.contains('chrome-off')) toggleChrome(false); else location.hash = ''; }
});
let wheelT = 0;
$('#reader').addEventListener('wheel', e => {
  const now = Date.now(); if (now - wheelT < 250 || Math.abs(e.deltaY) < 4) return; wheelT = now; go(e.deltaY > 0 ? 1 : -1);
}, {passive:true});
let idleT;
$('#reader').addEventListener('mousemove', () => {
  const r = $('#reader'); r.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => r.classList.add('idle'), 2000);
});
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (R.book && !$('#reader').classList.contains('hidden')) { buildViews(); show(); } }, 120) });

/* ---------------- 路由 ---------------- */
async function route(){
  const m = location.hash.match(/^#\/read\/([^/]+)(?:\/(\d+))?/);
  if (m) {
    if (!BOOKS.length) await loadLibrary();
    const id = decodeURIComponent(m[1]);
    if (R.book?.id === id && !$('#reader').classList.contains('hidden')) return;
    await openBook(id);
    if (m[2] != null) { R.page = +m[2]; buildViews(); show(); }
  } else {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    $('#reader').classList.add('hidden'); $('#library').classList.remove('hidden');
    document.title = '漫画书架'; R.book = null;
    await loadLibrary();
  }
}
addEventListener('hashchange', route);
route();
</script>
